name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (cores da ArcLogich)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B3DFF&color_dots=#ebedf0,#d9ccff,#b399ff,#7d5cff,#3F7BFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B3DFF&color_dots=#161b22,#2b1f5c,#4a33a8,#6a4dff,#3F7BFF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
