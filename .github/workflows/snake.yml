name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake (dark mode)
        uses: Platane/snk@v3
        with:
          github_user_name: Gabriel-Moreira-Valverde

          # Snake colors
          snake_color: "#8B5CF6"

          # Grid colors (DARK)
          bg_color: "#0d1117"
          color_dots: "#161b22,#1f2937,#1f2937,#161b22"

          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
